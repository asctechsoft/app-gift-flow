# /etc/nginx/sites-available/giftflow-api  (chỉ thêm file mới, không sửa site khác)
# Kèm /etc/nginx/conf.d/giftflow-limits.conf (khai báo vùng giới hạn tốc độ).
# Phần "managed by Certbot" do certbot --nginx thêm khi cấp chứng chỉ.
server {
    server_name giftflow-api.dspentertainment.cloud;

    client_max_body_size 6m;   # audio tối đa 3 MB + overhead multipart

    # --- header bảo mật (API JSON, không cần nhúng/đoán MIME) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Chỉ nhận các đường dẫn của API; còn lại (quét lỗ hổng, bot) bị cắt sớm, không tới Node.
    location ~ ^/(v1/|health/) {
        limit_req zone=gf_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ghi đè (không nối) để client không giả được IP bằng header X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
    }

    # Đăng nhập: giới hạn chặt hơn (chống dò/tạo tài khoản hàng loạt).
    location ~ ^/v1/auth/ {
        limit_req zone=gf_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Cache-Control;
    }

    location / {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/giftflow-api.dspentertainment.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/giftflow-api.dspentertainment.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = giftflow-api.dspentertainment.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name giftflow-api.dspentertainment.cloud;
    return 404; # managed by Certbot
}
